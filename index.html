<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuádruplos y triplos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecera">
    <h1>Cuádruplos y triplos</h1>
    <p>Escribe una expresión aritmética y mira cómo se traduce a código intermedio.</p>
  </header>

  <main class="disposicion">
    <section class="panel" aria-labelledby="titulo-captura">
      <h2 id="titulo-captura">Expresión</h2>
      <label for="ecuacion" class="visualmente-oculto">Ecuación</label>
      <input id="ecuacion" type="text" value="z = a + b * c" autocomplete="off" spellcheck="false"
             placeholder="Ejemplo: z = (a + b) * c">

      <div class="ejemplos" aria-label="Ejemplos">
        <button type="button" class="chip" data-ejemplo="z = a + b * c">a + b * c</button>
        <button type="button" class="chip" data-ejemplo="r = (a + b) * (c - d) / e">(a + b) * (c - d) / e</button>
        <button type="button" class="chip" data-ejemplo="w = -a + (b - c) * 2">-a + (b - c) * 2</button>
      </div>

      <div id="seccionVariables" hidden>
        <h3>Valores de las variables</h3>
        <div id="contenedorVariables" class="variables"></div>
      </div>

      <div class="acciones">
        <button id="btnCalcular" type="button" class="boton primario">Calcular</button>
        <button id="btnLimpiar" type="button" class="boton">Limpiar</button>
      </div>
      <div id="alertas" aria-live="polite"></div>
    </section>

    <section id="resultados" class="resultados" aria-labelledby="titulo-resultados">
      <h2 id="titulo-resultados" class="visualmente-oculto">Resultados</h2>
      <p class="vacio">Pulsa <strong>Calcular</strong> para ver los cuádruplos, los triplos y el resultado.</p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
